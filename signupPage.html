  <!-- Registration Form -->
  <section class="form-container">
    <h1>Create Your Account</h1>
    <form id="signupForm" action="backend/auth/signupForm.php" method="post">
      
      <!-- First Name -->
      <div class="input-box">
        <span class="icon"><i class="fas fa-user"></i></span>
        <input type="text" name="firstName" placeholder="Enter First Name" required>
      </div>

      <!-- Last Name -->
      <div class="input-box">
        <span class="icon"><i class="fas fa-user"></i></span>
        <input type="text" name="lastName" placeholder="Enter Last Name" required>
        <input type="hidden" name="userType" value="seller"> <!-- Hidden field to specify user type -->
      </div>  

      <!-- Email -->
      <div class="input-box">
        <span class="icon"><i class="fas fa-envelope"></i></span>
        <input type="email" name="email" placeholder="Enter Email" required>
      </div>

      <!-- Age -->
      <div class="input-box">
        <span class="icon"><i class="fas fa-calendar"></i></span>
        <input type="number" id="age" name="age" placeholder="Enter Age" min="18" required> <!-- Age validation to ensure user is at least 18 years old -->
      </div>

      <!-- Mobile Number -->
      <div class="input-box">
        <label for="mobile">Mobile Number</label>
      <div class="phone-input">
        <span class="country-code">+27 (ZA)</span>
        <input type="tel" id="mobile" name="mobile" placeholder="0821234567" pattern="[0-9]{10}" maxlength="10" required> <!-- Pattern and maxlength to ensure valid South African mobile number format -->
     </div>
     </div>

      <!-- Password -->
      <div class="input-box">
        <span class="icon"><i class="fas fa-lock"></i></span>
        <input type="password" name="password" placeholder="Enter Password" required>
      </div>

      <!-- Confirm Password -->
      <div class="input-box">
        <span class="icon"><i class="fas fa-lock"></i></span>
        <input type="password" name="confirmPassword" placeholder="Confirm Password" required>
      </div>

      <!-- Submit -->
      <form id="signupForm" action="uploadFurniture.html" method="post">
      <!-- input fields here -->
       <button type="submit" class="btn">Sign Up</button>
      </form>


      <p>Already have an account? <a href="assignmentRegistration.html">Login</a></p>
    </form>
  </section>
